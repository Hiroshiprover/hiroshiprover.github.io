en=true class="toggleIcon_g3eP systemToggleIcon_QzmC"><path fill=currentColor d="m12 21c4.971 0 9-4.029 9-9s-4.029-9-9-9-9 4.029-9 9 4.029 9 9 9zm4.95-13.95c1.313 1.313 2.05 3.093 2.05 4.95s-0.738 3.637-2.05 4.95c-1.313 1.313-3.093 2.05-4.95 2.05v-14c1.857 0 3.637 0.737 4.95 2.05z"/></svg></button></div><div class=navbarSearchContainer_Bca1></div></div></div><div role=presentation class=navbar-sidebar__backdrop></div></nav><div id=__docusaurus_skipToContent_fallback class="theme-layout-main main-wrapper mainWrapper_z2l0"><main class="container container--fluid margin-vert--lg"><div class="row mdxPageWrapper_j9I6"><div class="col col--8"><article><header><h1>TikZ 科学插图</h1></header>
<p>本地显式生成并检查的静态 SVG；站点构建不运行 TeX。</p>
<figure><h2>留数定理与积分围道</h2><div class=lab-figure><img src=/en/img/figures/residue-contour-12f534333f33b1fe.svg alt=上半平面的正向闭合围道，内部含两个极点。示意围道方向与留数定理，不指定具体函数。 width=276 height=198 style="aspect-ratio:275.664 / 197.747"/></div><figcaption>上半平面的正向闭合围道，内部含两个极点。示意围道方向与留数定理，不指定具体函数。<div><a href=/en/img/figures/residue-contour-12f534333f33b1fe.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>单光子交换费曼图</h2><div class=lab-figure><img src=/en/img/figures/feynman-exchange-d36e2a98aff73ba7.svg alt="电子散射的 t 道示意图；费米子箭头指向上方时间方向，内线为虚光子。未画出相同粒子散射的完整图集合。" width=261 height=148 style="aspect-ratio:260.643 / 147.681"/></div><figcaption>电子散射的 t 道示意图；费米子箭头指向上方时间方向，内线为虚光子。未画出相同粒子散射的完整图集合。<div><a href=/en/img/figures/feynman-exchange-d36e2a98aff73ba7.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>立方体与空间坐标</h2><div class=lab-figure><img src=/en/img/figures/geometry-cube-ed9de32c99b72df3.svg alt="边长 a 的立方体斜投影；虚线标出被遮挡的边，轴标签区分三个空间方向。" width=162 height=191 style="aspect-ratio:161.705 / 190.527"/></div><figcaption>边长 a 的立方体斜投影；虚线标出被遮挡的边，轴标签区分三个空间方向。<div><a href=/en/img/figures/geometry-cube-ed9de32c99b72df3.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>静态点源的 Yukawa 积分围道</h2><div class=lab-figure><img src=/en/img/figures/qft-yukawa-contour-5ad2df89722ce96b.svg alt="复 k 平面上，+im 位于蓝色上半圆内，−im 位于实轴下方，箭头标出闭合方向。" width=238 height=172 style="aspect-ratio:237.935 / 171.822"/></div><figcaption>沿实轴从 −R 积到 R，再沿上半圆逆时针返回。r 为正时只有 +im 的留数贡献于场。<div><a href=/en/img/figures/qft-yukawa-contour-5ad2df89722ce96b.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>推迟传播子与 Feynman 传播子的极点</h2><div class=lab-figure><img src=/en/img/figures/qft-propagator-poles-cdbd92aa32f538c2.svg alt=左图推迟处方的两个叉号都在实轴下方。右图负能量极点在上、正能量极点在下。下半圆顺时针，上半圆逆时针。 width=336 height=131 style="aspect-ratio:335.553 / 130.945"/></div><figcaption>实线对应正时间差，虚线对应负时间差。极点的无穷小位移在图上放大。<div><a href=/en/img/figures/qft-propagator-poles-cdbd92aa32f538c2.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>从实能量轴转到虚轴</h2><div class=lab-figure><img src=/en/img/figures/qft-wick-rotation-dcfe93e3b71980fd.svg alt="Wick 转动经过第一和第三象限。负能极点在第二象限，正能极点在第四象限。" width=214 height=193 style="aspect-ratio:213.72 / 193.425"/></div><figcaption>虚轴从下向上积分。虚线箭头表示两段实轴的转动方向，阴影中没有 Feynman 极点。<div><a href=/en/img/figures/qft-wick-rotation-dcfe93e3b71980fd.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>三次相互作用对二点函数的二阶修正</h2><div class=lab-figure><img src=/en/img/figures/qft-coordinate-two-point-493e66ba0475a740.svg alt="从上到下是两个分离的一点图、两条内部线连接两顶点的圈图、以及用一条支路接入的一点子图。对称因子依次为 4、2、2。" width=232 height=169 style="aspect-ratio:231.711 / 169.187"/></div><figcaption>1 和 2 是固定外点，x 和 y 是积分顶点。交换自环的端点或两条平行的内部线给出图中的对称因子。<div><a href=/en/img/figures/qft-coordinate-two-point-493e66ba0475a740.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>标量粒子散射的四条腿怎样连接</h2><div class=lab-figure><img src=/en/img/figures/qft-scalar-trees-5123e07858b2b031.svg alt="四个小图标有入射 p₁、p₂ 和出射 p₃、p₄。三个交换图的内线动量分别为 p₁+p₂、p₁−p₃、p₁−p₄。" width=293 height=180 style="aspect-ratio:293.256 / 180.132"/></div><figcaption>左上是四次相互作用的接触图。其余三图来自三次相互作用，着色的线传递动量 q，两个出射动量的标签决定是 t 道还是 u 道。<div><a href=/en/img/figures/qft-scalar-trees-5123e07858b2b031.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>切开一条内部线</h2><div class=lab-figure><img src=/en/img/figures/qft-one-particle-irreducible-0e29d0ed0c31b55f.svg alt="左侧是两顶点以两条平行线连接的 1PI 图，右侧是用一条线串接的两个同类二点图。" width=291 height=84 style="aspect-ratio:291.164 / 84.354"/></div><figcaption>虚线表示切口。左图切断上方内部线后，两端仍然相连。右图切断中间的传播子，就分成两个自能插入。<div><a href=/en/img/figures/qft-one-particle-irreducible-0e29d0ed0c31b55f.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>四次理论的一圈二点插入和反项</h2><div class=lab-figure><img src=/en/img/figures/qft-quartic-self-energy-e808d6ca880f714d.svg alt="一条携带 p 的标量线上有一根回到同一顶点的自环，对称因子为 2；另一幅是带叉号的二腿插入。" width=238 height=83 style="aspect-ratio:238.156 / 83.237"/></div><figcaption>左图的两个外端都通往同一个顶点，圈中动量 q 独立于 p。右图的叉号代表局域二腿反项。<div><a href=/en/img/figures/qft-quartic-self-energy-e808d6ca880f714d.svg download="">下载 SVG</a></div></figcaption></figure><figure><h2>五条外腿的一圈动量分配</h2><div class=lab-figure><img src=/en/img/figures/qft-pentagon-f294ddf61764ac39.svg alt="五边形圈的外腿依次为 k₁ 到 k₅，起始内线为 q，每经过一个顶点就加上该顶点的外动量。" width=187 height=178 style="aspect-ratio:186.697 / 177.766"/></div><figcaption>黑色箭头约定外动量都流进顶点，蓝色箭头给出同一个圈动量的流向。五段内部线只需一个独立积分。<div><a href=/en/img/figures/qft-pentagon-f294ddf61764ac39.svg download="">下载 SVG</a></div></figcaption></figure></article></div></div></main></div><footer class="theme-layout-footer footer footer--dark"><div class="container container-fluid"><div class="row footer__links"><div class="theme-layout-footer-column col footer__col"><div class=footer__title>Access</div><ul class="footer__items clean-list"><li class=footer__item><a href=https://github.com/Hiroshiprover/Hiroshiprover.github.io target=_blank rel="noopener noreferrer" class=footer__link-item>Source<svg width=13.5 height=13.5 aria-label="(opens in new tab)" class=iconExternalLink_nPIU><use href=#theme-svg-external-link /></svg></a></ul></div></div><div class="footer__bottom text--center"><div class=footer__copyright>Copyright © 2026 Hiroshiprover. Built with Docusaurus.</div></div></div></footer></div></body>
